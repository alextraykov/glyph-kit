<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notification settings</title>

<style>:root{--gk-ink:var(--ink, #080808);--gk-surface:var(--paper, #fbfbf8);--gk-panel:var(--panel, rgba(8, 8, 8, 0.035));--gk-muted:var(--muted, #666660);--gk-line:var(--line, rgba(8, 8, 8, 0.16));--gk-accent:var(--ink, #080808);--gk-on-accent:var(--paper, #fbfbf8);--gk-danger:var(--signal-fail, #b8421f);--gk-ok:var(--signal-ok, #04764e);--gk-space:var(--space-2, 10px);--gk-radius:var(--radius-0, 0);--gk-font:var(--sans, system-ui, sans-serif);--gk-mono:var(--mono, Menlo, monospace);--gk-duration-base:200ms;--gk-easing-base:var(--ease-snap, cubic-bezier(0.2, 0, 0, 1))}:root{--gk-deck-bg:#f7f6f1;--gk-deck-ink:#151513;--gk-deck-muted:#6d6c66;--gk-deck-data:#151513;--gk-deck-frame:#a3a199;--gk-deck-flag:#c4401c;--gk-deck-ok:#0a7a50}
:root{--gk-data:var(--gk-accent);--gk-frame:var(--gk-muted);--gk-flag:var(--gk-danger)}
.gk-d{color:var(--gk-data)}.gk-e{color:var(--gk-data);opacity:.45}.gk-f{color:var(--gk-frame)}.gk-x{color:var(--gk-flag)}.gk-ok{color:var(--gk-ok)}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
body{margin:0;background:var(--gk-surface);color:var(--gk-ink);font:15px/1.5 var(--gk-font);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--gk-accent);outline-offset:2px}
.gk-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gk-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;padding:14px 24px;background:var(--gk-surface);border-bottom:1px solid var(--gk-line)}
.gk-top h1{margin:0;font-size:15px;font-weight:600}
.gk-top p{margin:0;color:var(--gk-muted);font-size:14px}
.gk-chip{padding:2px 8px;border:1px solid var(--gk-line);border-radius:999px;color:var(--gk-muted);font:500 11px/1.6 var(--gk-mono);letter-spacing:.04em;text-transform:uppercase}
.gk-canvas{min-height:calc(100vh - 53px);display:grid;place-items:center;padding:56px 24px;background-color:var(--gk-panel);background-image:radial-gradient(color-mix(in srgb,var(--gk-ink) 14%,transparent) 1px,transparent 1px);background-size:16px 16px}
.gk-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;padding:12px 24px;color:var(--gk-muted);font-size:13px;border-top:1px solid var(--gk-line);background:var(--gk-surface)}
.gk-foot details summary{cursor:pointer}
.gk-foot pre{max-width:100%;overflow:auto}
pre.gk-figure{margin:0;padding:32px 36px;background:var(--gk-surface);border:1px solid var(--gk-line);border-radius:var(--gk-radius);font:13.5px/1.25 var(--gk-mono);white-space:pre;overflow-x:auto;font-variant-ligatures:none;letter-spacing:0;max-width:100%}
.gk-board{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:28px}
.gk-screen{position:relative;width:min(100%,max(320px,calc(var(--w) * 11.5px)));background:var(--gk-surface);border:1px solid var(--gk-line);border-radius:var(--gk-radius);box-shadow:0 1px 2px rgb(0 0 0 / .05),0 18px 48px rgb(0 0 0 / .09)}
.gk-screen__bar{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--gk-line);font-weight:600}
.gk-body{display:grid;gap:14px;padding:20px}
.gk-h{margin:0;color:var(--gk-muted);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.gk-p{margin:0}.gk-muted,.gk-meta{color:var(--gk-muted)}
.gk-gap{height:2px}
.gk-rule{margin:4px -20px;border:0;border-top:1px solid var(--gk-line)}
.gk-row{display:flex;align-items:center;gap:12px;min-height:36px}
.gk-row--toggle{justify-content:space-between}
.gk-row--field{display:grid;grid-template-columns:minmax(96px,34%) 1fr}
.gk-row--field label{color:var(--gk-muted)}
.gk-input,.gk-select select{width:100%;height:38px;padding:0 12px;border:1px solid var(--gk-line);border-radius:calc(var(--gk-radius) * .7);background:var(--gk-surface);color:var(--gk-ink);font:inherit;transition:border-color var(--gk-duration-base) var(--gk-easing-base)}
.gk-input:hover,.gk-select select:hover{border-color:color-mix(in srgb,var(--gk-ink) 35%,var(--gk-line))}
.gk-select{position:relative;display:block}
.gk-select select{appearance:none;-webkit-appearance:none;padding-right:40px;cursor:pointer}
.gk-select::after{content:"";position:absolute;right:16px;top:50%;width:7px;height:7px;border-right:1.5px solid var(--gk-muted);border-bottom:1.5px solid var(--gk-muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.gk-switch{appearance:none;-webkit-appearance:none;position:relative;flex:none;width:40px;height:24px;margin:0;border-radius:999px;background:color-mix(in srgb,var(--gk-ink) 18%,transparent);cursor:pointer;transition:background var(--gk-duration-base) var(--gk-easing-base)}
.gk-switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--gk-surface);box-shadow:0 1px 2px rgb(0 0 0 / .25);transition:transform var(--gk-duration-base) var(--gk-easing-base)}
.gk-switch:checked{background:var(--gk-accent)}.gk-switch:checked::after{transform:translateX(16px)}
.gk-check,.gk-radio{width:18px;height:18px;margin:0;accent-color:var(--gk-accent)}
.gk-radios{display:flex;flex-wrap:wrap;gap:8px 20px;margin:0;padding:0;border:0}.gk-radios label{display:inline-flex;align-items:center;gap:8px}
.gk-actions{display:flex;flex-wrap:wrap;gap:10px}.gk-actions--end{justify-content:flex-end}
.gk-btn{height:38px;padding:0 16px;border:1px solid var(--gk-line);border-radius:calc(var(--gk-radius) * .7);background:var(--gk-surface);color:var(--gk-ink);font:500 14px/1 var(--gk-font);cursor:pointer;transition:background var(--gk-duration-base) var(--gk-easing-base),opacity var(--gk-duration-base) var(--gk-easing-base)}
.gk-btn:hover{background:var(--gk-panel)}
.gk-btn--primary{background:var(--gk-accent);border-color:var(--gk-accent);color:var(--gk-on-accent)}.gk-btn--primary:hover{background:color-mix(in srgb,var(--gk-accent) 86%,var(--gk-surface))}
.gk-btn--danger{background:var(--gk-danger);border-color:var(--gk-danger);color:#fff}
.gk-btn:disabled{opacity:.4;cursor:not-allowed}
.gk-search{position:relative;display:flex;align-items:center}.gk-search .gk-input{padding-left:36px;padding-right:72px}
.gk-search__icon{position:absolute;left:13px;width:11px;height:11px;border:1.5px solid var(--gk-muted);border-radius:50%}.gk-search__icon::after{content:"";position:absolute;right:-5px;bottom:-4px;width:6px;height:1.5px;background:var(--gk-muted);transform:rotate(45deg)}
.gk-search kbd{position:absolute;right:10px;padding:2px 6px;border:1px solid var(--gk-line);border-radius:5px;color:var(--gk-muted);font:11px var(--gk-mono)}
.gk-tabs{display:flex;gap:4px;margin:-6px -4px 0;border-bottom:1px solid var(--gk-line)}
.gk-tabs button{position:relative;padding:8px 10px 12px;border:0;background:none;color:var(--gk-muted);font:500 14px/1 var(--gk-font);cursor:pointer}
.gk-tabs button[aria-selected=true]{color:var(--gk-ink)}
.gk-tabs button[aria-selected=true]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--gk-accent)}
.gk-list{margin:0 -20px;padding:0;list-style:none}
.gk-list li{display:flex;justify-content:space-between;gap:12px;padding:10px 20px;border-top:1px solid var(--gk-line)}
.gk-list li:last-child{border-bottom:1px solid var(--gk-line)}
.gk-list [aria-current]{background:color-mix(in srgb,var(--gk-accent) 8%,transparent);box-shadow:inset 3px 0 var(--gk-accent);font-weight:500}
.gk-list [aria-disabled]{color:var(--gk-muted)}
.gk-table{width:100%;border-collapse:collapse;font-size:14px}.gk-table th{color:var(--gk-muted);font-weight:500;text-align:left}.gk-table :is(th,td){padding:8px 0;border-bottom:1px solid var(--gk-line)}
.gk-image{display:grid;place-items:center;min-height:calc(var(--rows) * 30px);border-radius:calc(var(--gk-radius) * .7);background:repeating-linear-gradient(135deg,var(--gk-panel) 0 8px,color-mix(in srgb,var(--gk-panel) 50%,var(--gk-surface)) 8px 16px)}
.gk-image span{padding:2px 8px;border-radius:999px;background:var(--gk-surface);color:var(--gk-muted);font:12px var(--gk-mono)}
.gk-skeleton{display:grid;gap:10px}.gk-skeleton span{height:12px;border-radius:6px;background:var(--gk-panel)}.gk-skeleton span:nth-child(2){width:72%}.gk-skeleton span:nth-child(3){width:84%}
.gk-empty{display:grid;justify-items:center;gap:12px;padding:28px 12px;text-align:center}.gk-empty p{max-width:30ch;margin:0;color:var(--gk-muted)}
.gk-empty__mark{font:22px/1 var(--gk-mono);letter-spacing:2px;color:var(--gk-muted)}
.gk-noted{position:relative}
.gk-pin{display:inline-grid;place-items:center;flex:none;width:22px;height:22px;border-radius:50%;background:var(--gk-accent);color:var(--gk-on-accent);font:600 12px/1 var(--gk-font)}
.gk-noted > .gk-pin{position:absolute;right:-33px;top:50%;transform:translateY(-50%);box-shadow:0 0 0 3px var(--gk-surface)}
.gk-notes{display:grid;gap:12px;width:min(100%,260px);margin:0;padding:16px;list-style:none;background:var(--gk-surface);border:1px solid var(--gk-line);border-radius:var(--gk-radius);font-size:14px}
.gk-notes li{display:flex;gap:10px;align-items:flex-start}
.gk-dimmer{position:absolute;inset:0;display:grid;place-items:center;padding:20px;border-radius:inherit;background:rgb(10 10 12 / .42)}
.gk-dimmer[hidden]{display:none}
.gk-dialog{width:min(100%,360px);background:var(--gk-surface);border-radius:var(--gk-radius);box-shadow:0 24px 64px rgb(0 0 0 / .28)}
.gk-dialog h3{margin:0;padding:18px 20px 0;font-size:16px}
.gk-dialog .gk-body{padding-top:10px}
.gk-pair{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:40px}
.gk-pair figure{display:grid;gap:12px;margin:0}.gk-pair figcaption{color:var(--gk-muted);font:500 12px var(--gk-mono)}
.gk-stage{display:grid;gap:14px;width:min(100%,520px);padding:20px;background:var(--gk-surface);border:1px solid var(--gk-line);border-radius:var(--gk-radius)}
.gk-stage p{margin:0;color:var(--gk-muted);font-size:13px}
.gk-actor{width:120px;height:72px;border-radius:calc(var(--gk-radius) * .7);background:var(--gk-accent)}
.gk-actor--small{width:56px;height:56px}.gk-actors{display:flex;gap:10px}
.gk-figure-wrap{display:grid;justify-items:center;gap:20px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0s!important;animation-duration:0s!important}.gk-play{display:none}}

html,body{height:100%;margin:0;overflow:hidden;background:var(--gk-deck-bg)}
body{color:var(--gk-deck-ink)}
.gk-deck{position:fixed;inset:0 0 36px;overflow:hidden}
.gk-stagebox{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center}
.gk-slide{position:absolute;inset:0;display:none;grid-template-rows:auto minmax(0,1fr) auto;gap:28px;padding:72px 88px 56px;background:var(--gk-deck-bg)}
.gk-slide.is-current{display:grid}
.gk-kicker{margin:0;color:var(--gk-deck-muted);font:500 18px/1.4 var(--gk-mono);letter-spacing:.04em;text-transform:uppercase}
.gk-slide h2{margin:6px 0 0;font:600 60px/1.05 var(--gk-font);letter-spacing:-.025em;max-width:24ch}
.gk-lead{margin:14px 0 0;max-width:60ch;color:var(--gk-deck-muted);font:400 26px/1.4 var(--gk-font)}
.gk-view{position:relative;overflow:hidden;min-height:0}
.gk-world{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform 700ms cubic-bezier(.2,0,0,1)}
.gk-fig{margin:0;font:20px/1.25 var(--gk-mono);font-variant-ligatures:none;letter-spacing:0;color:var(--gk-deck-ink)}
.gk-ln{display:block;width:max-content;min-height:1.25em;white-space:pre;transition:opacity 400ms ease}
.gk-cmd{display:block;width:max-content;margin-bottom:.6em;color:var(--gk-deck-muted);white-space:pre}
.gk-cmd b{color:var(--gk-deck-ink);font-weight:400}
.gk-dim .gk-ln:not(.is-focus),.gk-dim .gk-cmd{opacity:.2}
.gk-say{display:flex;gap:16px;align-items:baseline;min-height:42px;margin:0;font:400 28px/1.35 var(--gk-font)}
.gk-say:empty{visibility:hidden}
.gk-say::before{content:"►";color:var(--gk-deck-data);font:18px var(--gk-mono)}
.gk-source-line{margin:0;color:var(--gk-deck-muted);font:400 15px/1.4 var(--gk-mono)}
.gk-slide--title,.gk-slide--statement{align-content:center;grid-template-rows:auto}
.gk-slide--title h2{font-size:104px;max-width:14ch}
.gk-slide--title .gk-lead{font-size:32px}
.gk-ramp{margin-bottom:32px;color:var(--gk-deck-data);font:64px/1 var(--gk-mono);letter-spacing:14px}
.gk-slide--section{align-content:end;grid-template-rows:auto}
.gk-slide--section h2{font-size:88px}
.gk-statement{margin:0;max-width:24ch;font:600 72px/1.12 var(--gk-font);letter-spacing:-.025em}
.gk-proto{width:max-content}
.gk-proto .gk-board{flex-wrap:nowrap}
.gk-proto .gk-screen{width:max(320px,calc(var(--w) * 11.5px))}
.gk-proto .gk-notes{width:260px}
.gk-bar{position:fixed;left:0;right:0;bottom:0;height:36px;display:flex;align-items:center;gap:16px;padding:0 16px;color:var(--gk-deck-muted);font:13px/1 var(--gk-mono);pointer-events:none}
.gk-ticks{letter-spacing:1px;white-space:nowrap;overflow:hidden}
.gk-count{margin-left:auto}
.gk-notes-panel{position:fixed;left:16px;right:16px;bottom:44px;max-height:30vh;overflow:auto;margin:0;padding:16px 20px;border:1px solid var(--gk-deck-muted);background:var(--gk-deck-bg);color:var(--gk-deck-ink);font:17px/1.5 var(--gk-font);white-space:pre-wrap}
.gk-notes-panel[hidden]{display:none}
.gk-hint{position:fixed;right:16px;top:12px;margin:0;color:var(--gk-deck-muted);font:12px var(--gk-mono)}
@keyframes gk-type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes gk-flash{0%,49%{background:var(--gk-deck-flag);color:var(--gk-deck-bg)}50%,100%{background:transparent}}
.is-printing .gk-ln,.is-printing .gk-cmd,.is-typing{animation:gk-type var(--d,160ms) steps(var(--n,18),end) both;animation-delay:var(--at,0ms)}
.is-printing .gk-ln.is-flag{animation:gk-type 160ms steps(18,end) both var(--at,0ms),gk-flash 260ms steps(1) calc(var(--at,0ms) + 220ms) 2}
@media (prefers-reduced-motion:reduce){.gk-world{transition:none}.is-printing .gk-ln,.is-printing .gk-cmd,.is-typing,.is-printing .gk-ln.is-flag{animation:none!important;clip-path:none}}
@media print{
  @page{size:1600px 900px;margin:0}
  html,body{overflow:visible;height:auto}
  .gk-deck{position:static;display:block}
  .gk-stagebox{position:static;transform:none!important;height:auto}
  .gk-slide{position:relative;display:grid!important;width:1600px;height:900px;break-after:page}
  .gk-bar,.gk-notes-panel,.gk-hint{display:none!important}
  .gk-ln,.gk-cmd,.gk-title{opacity:1!important;animation:none!important;clip-path:none!important}
  /* No camera on paper: the figure sits at a fixed presentation size. */
  .gk-view{overflow:visible}
  .gk-world{position:static;transform:none!important}
  .gk-fig{font-size:30px}
  .gk-proto{zoom:1.4}
}
.gk-d{color:var(--gk-deck-data)}.gk-e{color:var(--gk-deck-data);opacity:.45}.gk-f{color:var(--gk-deck-frame)}.gk-x{color:var(--gk-deck-flag)}.gk-ok{color:var(--gk-deck-ok)}</style>
</head>
<body>
<main class="gk-deck"><div class="gk-stagebox">
<section class="gk-slide" data-steps="[]" data-flag="" aria-roledescription="slide" aria-label="1 of 1">
<header><p class="gk-kicker">Screen wireframe</p><h2 class="gk-title">Notification settings</h2><p class="gk-lead">Agree on content and order before visual design.</p></header>
<div class="gk-view"><div class="gk-world"><div class="gk-proto"><div class="gk-board"><section class="gk-screen" aria-label="Settings" style="--w:46" data-screen><header class="gk-screen__bar"><span>Settings</span></header><div class="gk-body"><div class="gk-tabs" role="tablist" data-component=".case-switch"><button type="button" role="tab" aria-selected="false">Profile</button><button type="button" role="tab" aria-selected="true">Notifications</button><button type="button" role="tab" aria-selected="false">Billing</button></div>
<div class="gk-gap" aria-hidden="true"></div>
<div class="gk-noted"><div class="gk-row gk-row--toggle"><label for="gk-f3">Email me when a report is ready</label><input class="gk-switch" id="gk-f3" type="checkbox" role="switch" checked data-component="&lt;button aria-pressed&gt;"></div><span class="gk-pin" aria-hidden="true">1</span></div>
<div class="gk-row gk-row--toggle"><label for="gk-f4">Weekly summary</label><input class="gk-switch" id="gk-f4" type="checkbox" role="switch" data-component="&lt;button aria-pressed&gt;"></div>
<div class="gk-row gk-row--field"><label for="gk-f5">Digest day</label><span class="gk-select"><select id="gk-f5" data-component="the shared styled select (tool panels, section 23)"><option>Monday</option><option>Wednesday</option><option>Friday</option></select></span></div>
<div class="gk-row gk-row--field"><label for="gk-f6">Send to</label><input class="gk-input" id="gk-f6" value="team@example.com" placeholder="" data-component="input"></div>
<hr class="gk-rule">
<div class="gk-noted"><div class="gk-actions gk-actions--end"><button type="button" class="gk-btn" data-component="&lt;a data-ascii-action&gt;">Cancel</button><button type="button" class="gk-btn gk-btn--primary" data-component="&lt;a data-ascii-action&gt;" disabled data-until-change>Save</button></div><span class="gk-pin" aria-hidden="true">2</span></div></div></section><ol class="gk-notes" aria-label="Notes"><li><span class="gk-pin" aria-hidden="true">1</span><span><span class="gk-sr">Note 1: </span>Off by default for new teams.</span></li><li><span class="gk-pin" aria-hidden="true">2</span><span><span class="gk-sr">Note 2: </span>Save is disabled until something changes.</span></li></ol></div></div></div></div>
<footer><p class="gk-say" aria-live="polite"></p><p class="gk-source-line">Source: Sample data, made up for this example</p></footer>
<template class="gk-notes-src"></template>
</section>
</div></main>
<div class="gk-bar" aria-hidden="true"><span class="gk-ticks"></span><span class="gk-count"></span></div>
<pre class="gk-notes-panel" hidden aria-label="Presenter notes"></pre>
<p class="gk-hint" aria-hidden="true">→ next · ← back · N notes · F full screen</p>
<script>
document.querySelectorAll("[data-gk-stage]").forEach((s)=>{const b=s.querySelector("[data-gk-play]");const play=()=>{s.classList.add("is-from");void s.offsetWidth;requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.remove("is-from")))};b&&b.addEventListener("click",play);if(!matchMedia("(prefers-reduced-motion: reduce)").matches)play()});
document.querySelectorAll(".gk-tabs").forEach((t)=>t.addEventListener("click",(e)=>{const b=e.target.closest("[role=tab]");if(!b)return;t.querySelectorAll("[role=tab]").forEach((x)=>x.setAttribute("aria-selected",String(x===b)))}));
document.querySelectorAll("[data-screen]").forEach((screen)=>{const wake=()=>screen.querySelectorAll("[data-until-change]").forEach((b)=>b.disabled=false);screen.addEventListener("input",wake);screen.addEventListener("change",wake);const d=screen.querySelector("[data-dialog]");if(!d)return;d.querySelectorAll("[data-close]").forEach((b)=>b.addEventListener("click",()=>{d.hidden=true;screen.querySelector("[data-reopen]")?.removeAttribute("hidden")}));addEventListener("keydown",(e)=>{if(e.key==="Escape")d.hidden=true});screen.querySelector(".gk-list")?.addEventListener("click",()=>{d.hidden=false})});
(function runtime() {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const box = document.querySelector(".gk-stagebox");
  const slides = [...document.querySelectorAll(".gk-slide")];
  const ticks = document.querySelector(".gk-ticks");
  const count = document.querySelector(".gk-count");
  const panel = document.querySelector(".gk-notes-panel");
  let slide = 0;
  let step = 0;

  const fitStage = () => {
    const k = Math.min(innerWidth / 1600, (innerHeight - 36) / 900);
    box.style.transform = `translate(-50%, -50%) scale(${k})`;
  };
  const stepsOf = (s) => JSON.parse(s.dataset.steps || "[]");

  // Fit the figure into the view, or zoom to a range of lines and dim the rest.
  const camera = (s, target) => {
    const view = s.querySelector(".gk-view");
    const world = s.querySelector(".gk-world");
    if (!view || !world) return;
    const fig = world.firstElementChild;
    const vw = view.clientWidth;
    const vh = view.clientHeight;
    let x = 0;
    let y = 0;
    let w = fig.scrollWidth;
    let h = fig.scrollHeight;
    const lns = [...world.querySelectorAll(".gk-ln")];
    lns.forEach((l) => l.classList.remove("is-focus"));
    world.classList.toggle("gk-dim", Boolean(target));
    if (target && lns.length) {
      const pick = lns.slice(target.lines[0], target.lines[1] + 1);
      pick.forEach((l) => l.classList.add("is-focus"));
      x = Math.min(...pick.map((l) => l.offsetLeft));
      y = pick[0].offsetTop;
      w = Math.max(...pick.map((l) => l.offsetLeft + l.offsetWidth)) - x;
      h = pick.at(-1).offsetTop + pick.at(-1).offsetHeight - y;
    }
    const k = Math.min(vw / w, vh / h, target ? 3 : 2.2);
    world.style.transform = `translate(${(vw - w * k) / 2 - x * k}px, ${target ? (vh - h * k) / 2 - y * k : 0}px) scale(${k})`;
  };

  // Type the title, type the command, print the figure line by line, flash flagged lines.
  const play = (s) => {
    if (reduce) return;
    const title = s.querySelector(".gk-title");
    if (title) {
      const n = title.textContent.length;
      title.style.setProperty("--n", n);
      title.style.setProperty("--d", `${Math.min(n * 22, 420)}ms`);
      title.classList.remove("is-typing");
      void title.offsetWidth;
      title.classList.add("is-typing");
    }
    const fig = s.querySelector(".gk-fig");
    if (!fig) return;
    const flag = s.dataset.flag ? new RegExp(s.dataset.flag) : null;
    let at = 320;
    const cmd = fig.querySelector(".gk-cmd");
    if (cmd) {
      const n = cmd.textContent.length;
      cmd.style.setProperty("--n", n);
      cmd.style.setProperty("--d", `${n * 34}ms`);
      cmd.style.setProperty("--at", `${at}ms`);
      at += n * 34 + 280;
    }
    fig.querySelectorAll(".gk-ln").forEach((l, i) => {
      l.style.setProperty("--at", `${at + i * 42}ms`);
      l.classList.toggle("is-flag", Boolean(flag && flag.test(l.textContent)));
    });
    fig.classList.remove("is-printing");
    void fig.offsetWidth;
    fig.classList.add("is-printing");
  };

  const decode = (t) => t.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, "&");

  const render = (animate) => {
    const s = slides[slide];
    slides.forEach((x, i) => x.classList.toggle("is-current", i === slide));
    const steps = stepsOf(s);
    const target = step > 0 ? steps[step - 1] : null;
    camera(s, target);
    const say = s.querySelector(".gk-say");
    if (say) say.textContent = target?.say ?? "";
    if (animate) play(s);
    ticks.textContent = slides.map((_, i) => (i < slide ? "█" : i === slide ? "▓" : "░")).join("");
    count.textContent = `${slide + 1} / ${slides.length}${steps.length ? ` · step ${step} of ${steps.length}` : ""}`;
    panel.textContent = decode(s.querySelector(".gk-notes-src")?.innerHTML ?? "") || "No notes for this slide.";
    history.replaceState(null, "", `#${slide + 1}.${step}`);
  };

  const go = (dir) => {
    const steps = stepsOf(slides[slide]).length;
    if (dir > 0) {
      if (step < steps) step += 1;
      else if (slide < slides.length - 1) {
        slide += 1;
        step = 0;
        return render(true);
      }
    } else if (step > 0) step -= 1;
    else if (slide > 0) {
      slide -= 1;
      step = stepsOf(slides[slide]).length;
    }
    render(false);
  };

  addEventListener("keydown", (e) => {
    if (e.target.closest?.("input, select, textarea")) return;
    const key = e.key.toLowerCase();
    if (["arrowright", "pagedown", " ", "enter"].includes(key)) {
      e.preventDefault();
      go(1);
    } else if (["arrowleft", "pageup", "backspace"].includes(key)) {
      e.preventDefault();
      go(-1);
    } else if (key === "home") {
      slide = 0;
      step = 0;
      render(true);
    } else if (key === "end") {
      slide = slides.length - 1;
      step = 0;
      render(true);
    } else if (key === "n") panel.hidden = !panel.hidden;
    else if (key === "f") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
  });
  document.querySelector(".gk-deck").addEventListener("click", (e) => {
    if (e.target.closest("button, a, input, select, label, [role=tab], .gk-screen")) return;
    go(e.clientX > innerWidth / 4 ? 1 : -1);
  });
  addEventListener("resize", () => {
    fitStage();
    camera(slides[slide], step ? stepsOf(slides[slide])[step - 1] : null);
  });

  const [s0, st0] = location.hash.slice(1).split(".").map((n) => parseInt(n, 10));
  slide = Math.min(Math.max((s0 || 1) - 1, 0), slides.length - 1);
  step = Math.min(st0 || 0, stepsOf(slides[slide]).length);
  fitStage();
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => render(true));
})();</script>
</body>
</html>
